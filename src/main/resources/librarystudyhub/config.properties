# Library Study Hub - application settings (nothing is hard-coded in the Java source).
# You can override any value by placing a file named "studyhub.properties"
# in the folder you start the program from.

# ---- Server ----
server.port=5050
server.seats=8
server.maxSeats=30
server.width=1120
server.height=660

# ---- Chat ----
chat.maxLength=500
nickname.pattern=[A-Za-z0-9_]{2,16}
nickname.rule=2-16 characters using letters, digits or underscore

# ---- Shared session timer ----
timer.defaultMinutes=25
timer.maxMinutes=180
timer.maxLabelLength=40

# ---- Client Desktop Window ----
client.defaultHost=localhost
client.connectTimeoutMs=5000
client.width=1280
client.height=760

